x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  image: flight-disruption-aws
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
  logging: *logging

services:
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_ROLL_HOURS: 24
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *logging

  generator:
    <<: *app
    command: python -m fda.generator
    mem_limit: 128m

  consumer:
    <<: *app
    command: python -m fda.consumer
    env_file: .env
    environment:
      AWS_DEFAULT_REGION: eu-central-1
    mem_limit: 256m
    stop_grace_period: 30s

volumes:
  kafka-data:
